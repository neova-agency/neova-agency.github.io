<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Blog | NEOVA - Agence IA, Cybersécurité, Vidéo & Contenu</title>
    <meta name="description" content="Consultez les articles du blog NEOVA : IA, Cybersécurité, Montage Vidéo, Création de Contenu.">
    <meta name="keywords" content="NEOVA, blog, IA, cybersécurité, montage vidéo, création de contenu, Antananarivo">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #00F2EA;
            --secondary-color: #4FACFE;
            --bg-dark: #0B0F19;
            --bg-lighter: #1A2035;
            --text-color: #E2E8F0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }

        /* HEADER */
        header {
            background-color: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 5%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 40px;
            height: auto;
            filter: drop-shadow(0 0 10px var(--primary-color));
            animation: logoPulse 2s infinite alternate;
        }

        @keyframes logoPulse {
            from { filter: drop-shadow(0 0 5px var(--primary-color)); transform: scale(1); }
            to { filter: drop-shadow(0 0 20px var(--primary-color)); transform: scale(1.05); }
        }

        .logo-text {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            letter-spacing: 2px;
        }

        .menu-toggle {
            display: block;
            font-size: 2rem;
            cursor: pointer;
            color: var(--primary-color);
            background: none;
            border: none;
        }

        .contact-info-top {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.9rem;
        }

        .contact-info-top a {
            color: var(--primary-color);
            font-weight: bold;
        }

        /* NAVIGATION OVERLAY */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        .nav-overlay.open {
            display: flex;
        }

        .nav-overlay a {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s;
        }

        .nav-overlay a:hover {
            color: var(--primary-color);
        }

        /* MAIN CONTENT */
        .blog-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 5%;
        }

        .blog-title {
            text-align: center;
            color: white;
            font-size: 3rem;
            margin-bottom: 2rem;
        }

        /* SEARCH & FILTERS */
        .search-filters {
            margin-bottom: 3rem;
            text-align: center;
        }

        .search-input {
            padding: 12px 20px;
            border-radius: 50px;
            border: 2px solid #333;
            background-color: var(--bg-lighter);
            color: white;
            font-size: 1rem;
            width: 100%;
            max-width: 500px;
            margin-bottom: 1.5rem;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid #333;
            background-color: var(--bg-lighter);
            color: white;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: transparent;
        }

        /* BLOG GRID */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .blog-post {
            background-color: var(--bg-lighter);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .blog-post:hover { transform: scale(1.02); }

        .blog-post img { width: 100%; height: 200px; object-fit: cover; }
        .blog-content { padding: 1.5rem; }
        .blog-date { color: var(--secondary-color); font-size: 0.9rem; margin-bottom: 0.5rem; }
        .blog-category { 
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            background-color: var(--primary-color);
            color: var(--bg-dark);
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .blog-author { color: #888; font-size: 0.8rem; margin-top: 0.5rem; }

        /* FOOTER */
        footer {
            background-color: var(--bg-lighter);
            padding: 3rem 5%;
            text-align: center;
            border-top: 1px solid #333;
        }

        .social-icons a { color: var(--primary-color); font-size: 1.5rem; margin: 0 10px; }
        .social-icons a:hover { transform: scale(1.2); }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .blog-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <div class="logo-container">
            <img src="logo NEOVA/logo.jpg" alt="Logo NEOVA" class="logo-img">
            <div class="logo-text">NEOVA</div>
        </div>
        <div class="contact-info-top">
            <a href="https://wa.me/261379661485" target="_blank">💬 WhatsApp</a>
        </div>
    </header>

    <!-- Menu overlay vertical -->
    <div class="nav-overlay" id="nav-overlay">
        <a href="index.html">Accueil</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#process">Notre Process</a>
        <a href="index.html#about">Pourquoi nous</a>
        <a href="index.html#testimonials">Avis</a>
        <a href="blog.html" class="active">Blog</a>
        <a href="index.html#contact">Contact</a>
    </div>

    <main class="blog-container">
        <h1 class="blog-title">NOTRE BLOG</h1>

        <div class="search-filters">
            <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un article...">
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-category="all">Tous</button>
                <button class="filter-btn" data-category="IA">IA</button>
                <button class="filter-btn" data-category="Cybersécurité">Cybersécurité</button>
                <button class="filter-btn" data-category="Montage Vidéo">Montage Vidéo</button>
                <button class="filter-btn" data-category="Création de Contenu">Création de Contenu</button>
            </div>
        </div>

        <div class="blog-grid" id="blogGrid">
            <!-- Les articles s'afficheront ici -->
        </div>
    </main>

    <footer>
        <div class="logo-text" style="font-size:1.5rem; margin-bottom:1rem;">NEOVA</div>
        <p>Antananarivo, Madagascar</p>
        <p>Téléphone / WhatsApp : <strong>037 20 47 086</strong> / <strong>037 96 61 485</strong></p>
        <p>Email : <strong>neovaentreprises@gmail.com</strong></p>
        <div class="social-icons">
            <a href="https://www.facebook.com/neovatech?locale=fr_FR" target="_blank">Facebook</a>
            <a href="#">LinkedIn</a>
            <a href="https://wa.me/261379661485" target="_blank">WhatsApp</a>
        </div>
        <p style="margin-top:2rem; font-size:0.8rem; color:#888;">&copy; 2026 NEOVA. Tous droits réservés.</p>
    </footer>

    <script>
        // Charger et afficher les articles
        async function loadBlogPosts() {
            try {
                const response = await fetch('https://sheetdb.io/api/v1/6wzg9224zsejp');
                const posts = await response.json();
                
                // Trier par date (les plus récents en premier)
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                const blogGrid = document.getElementById('blogGrid');
                blogGrid.innerHTML = '';

                posts.forEach(post => {
                    const article = document.createElement('article');
                    article.className = 'blog-post';
                    article.dataset.category = post.categorie || '';
                    article.dataset.titre = post.titre || '';
                    article.dataset.description = post.description || '';

                    article.innerHTML = `
                        <img src="${post.image}" alt="${post.titre}">
                        <div class="blog-content">
                            <div class="blog-date">${post.date}</div>
                            ${post.categorie ? `<div class="blog-category">${post.categorie}</div>` : ''}
                            <h3>${post.titre}</h3>
                            <p>${post.description || ''}</p>
                            <p class="blog-author">Par ${post.auteur || 'NEOVA'}</p>
                            <a href="article.html?titre=${encodeURIComponent(post.titre)}" style="color:var(--primary-color)">Lire la suite &rarr;</a>
                        </div>
                    `;
                    blogGrid.appendChild(article);
                });

                // Activer la recherche et les filtres
                setupSearchAndFilters();
            } catch (error) {
                console.error('Erreur lors du chargement des articles:', error);
            }
        }

        // Recherche et filtres
        function setupSearchAndFilters() {
            const searchInput = document.getElementById('searchInput');
            const filterButtons = document.querySelectorAll('.filter-btn');
            const articles = document.querySelectorAll('.blog-post');

            searchInput.addEventListener('input', () => {
                const searchTerm = searchInput.value.toLowerCase();
                articles.forEach(article => {
                    const titre = article.dataset.titre.toLowerCase();
                    const description = article.dataset.description.toLowerCase();
                    if (titre.includes(searchTerm) || description.includes(searchTerm)) {
                        article.style.display = 'block';
                    } else {
                        article.style.display = 'none';
                    }
                });
            });

            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    const category = button.dataset.category;

                    articles.forEach(article => {
                        if (category === 'all' || article.dataset.category === category) {
                            article.style.display = 'block';
                        } else {
                            article.style.display = 'none';
                        }
                    });
                });
            });
        }

        // Charger les articles
        loadBlogPosts();

        // MENU BURGER
        function toggleMenu() {
            const overlay = document.getElementById('nav-overlay');
            overlay.classList.toggle('open');
        }

        document.querySelectorAll('#nav-overlay a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('nav-overlay').classList.remove('open');
            });
        });
    </script>
</body>
</html>
